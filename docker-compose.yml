services:
  dealbot:
    build: .
    container_name: dealbot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data                       # database, sessions, logs, temp media
      - ./config.yaml:/app/config.yaml:ro      # your lists and thresholds
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
